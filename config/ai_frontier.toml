# Vertical configuration: AI frontier daily
# English sources -> English report.
# Focus: frontier models, agents, benchmarks, safety, major lab moves, product launches.

vertical = "ai-frontier"

# Prescreen threshold: let more candidates reach the LLM review gate.
# Frontier-editor tuning (2026-08-06): lowered from 6 to 3 so industry moves,
# leadership changes, and regulatory stories are not rejected by title-only keywords.
# The review stage remains the real quality gate; negatives still filter obvious noise.
threshold = 3

# High-weight terms: strong frontier-AI signals on their own.
[[keywords]]
term = "agent"
weight = 5

[[keywords]]
term = "benchmark"
weight = 5

[[keywords]]
term = "multimodal"
weight = 5

[[keywords]]
term = "reasoning"
weight = 5

[[keywords]]
term = "safety"
weight = 5

[[keywords]]
term = "alignment"
weight = 5

[[keywords]]
term = "regulation"
weight = 5

[[keywords]]
term = "open weights"
weight = 5

[[keywords]]
term = "foundation model"
weight = 5

[[keywords]]
term = "RLHF"
weight = 5

# Medium-weight terms: important but need company/context to pass.
[[keywords]]
term = "LLM"
weight = 4

[[keywords]]
term = "post-training"
weight = 4

[[keywords]]
term = "long-context"
weight = 4

[[keywords]]
term = "MoE"
weight = 4

[[keywords]]
term = "distillation"
weight = 4

[[keywords]]
term = "eval"
weight = 4

[[keywords]]
term = "red team"
weight = 4

# Company / model names: good signal when combined with product/release terms.
[[keywords]]
term = "GPT"
weight = 3

[[keywords]]
term = "Claude"
weight = 3

[[keywords]]
term = "Gemini"
weight = 3

[[keywords]]
term = "Llama"
weight = 3

[[keywords]]
term = "Mistral"
weight = 3

[[keywords]]
term = "xAI"
weight = 3

[[keywords]]
term = "DeepMind"
weight = 3

[[keywords]]
term = "Anthropic"
weight = 3

[[keywords]]
term = "OpenAI"
weight = 3

[[keywords]]
term = "Moonshot"
weight = 3

[[keywords]]
term = "Qwen"
weight = 3

# Industry-movement signals: high-value stories (leadership, funding, regulation,
# scandal) often fail the research-oriented keyword set. Weight 3 means they need
# one more frontier-AI signal to clear the gate, which keeps noise down while
# letting the LLM review stage judge editorial importance.
[[keywords]]
term = "CEO"
weight = 3

[[keywords]]
term = "chair"
weight = 3

[[keywords]]
term = "leadership"
weight = 3

[[keywords]]
term = "funding"
weight = 3

[[keywords]]
term = "acquisition"
weight = 3

[[keywords]]
term = "investigate"
weight = 3

[[keywords]]
term = "lawsuit"
weight = 3

[[keywords]]
term = "ban"
weight = 3

[[keywords]]
term = "regulator"
weight = 3

[[keywords]]
term = "boycott"
weight = 3

# Low-weight helpers: broaden recall without passing generic headlines alone.
[[keywords]]
term = "AI"
weight = 2

[[keywords]]
term = "model"
weight = 2

[[keywords]]
term = "Google"
weight = 1

[[keywords]]
term = "Meta"
weight = 1

# Negatives: filter obvious noise.
[[negatives]]
term = "sponsored"
weight = 5

[[negatives]]
term = "deals"
weight = 3

[[negatives]]
term = "review"
weight = 3

[[negatives]]
term = "crypto"
weight = 3

[[negatives]]
term = "NFT"
weight = 3

[[negatives]]
term = "webinar"
weight = 3

[[negatives]]
term = "podcast"
weight = 2

[[negatives]]
term = "stock price"
weight = 2

[[negatives]]
term = "earnings call"
weight = 2

# Categories add bonuses when headlines clearly belong to a frontier-AI sub-beat.
[[categories]]
name = "models"
keywords = ["model", "LLM", "GPT", "Claude", "Gemini", "Llama", "Mistral", "xAI", "open weights", "foundation model", "MoE", "distillation"]
bonus = 3

[[categories]]
name = "products"
keywords = ["product", "launch", "feature", "API", "chatbot", "assistant", "app"]
bonus = 2

[[categories]]
name = "safety"
keywords = ["safety", "alignment", "risk", "red team", "eval", "harm", "regulation", "policy"]
bonus = 3

[[categories]]
name = "business"
keywords = ["funding", "investment", "IPO", "acquisition", "partnership", "revenue"]
bonus = 2

[[categories]]
name = "research"
keywords = ["paper", "arxiv", "study", "benchmark", "result", "SOTA"]
bonus = 2

[[categories]]
name = "industry"
keywords = ["CEO", "chair", "leadership", "funding", "acquisition", "investigate", "lawsuit", "ban", "regulator", "boycott", "partnership", "revenue", "IPO"]
bonus = 2

# Source registry — all verified reachable RSS/Atom feeds.
# 36-hour window prevents stale backlog from contaminating the daily issue on first run.
[[sources]]
id = "hn_rss"
name = "Hacker News"
