# Scan source: Qwen official blog has no public RSS/Atom feed.
# We extract posts from the landing page with a regex and rely on frontpage diff
# for the daily signal (no reliable pubDate, so missing_date_policy = include).
[[sources]]
id = "qwen_blog"
name = "Qwen Blog"
list_url = "https://qwenlm.github.io/"

[sources.extract_profile]
method = "regex"
pattern = '<h2>([^<]+)</h2>.*?<a[^>]*class=entry-link[^>]*href=([^\s>]+)[^>]*>'
title_group = 0
url_group = 1
window_hours = 36
missing_date_policy = "include"

# Human-feed source: owner/agent drops links (e.g. from X) during the daily window.
# No list_url; entries are injected separately. It still participates in the
# registry and can trigger ECHO source-proposal questions.
[[sources]]
id = "owner_tips"
name = "Owner Tips"
list_url = ""
extract_profile = { method = "human_feed" }
