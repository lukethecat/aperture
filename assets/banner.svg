<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- background -->
  <rect width="1200" height="400" fill="#0d1117"/>

  <!-- left-side Kandinsky composition -->
  <circle cx="220" cy="200" r="150" fill="none" stroke="#f4a261" stroke-width="4" opacity="0.85"/>
  <circle cx="220" cy="200" r="110" fill="none" stroke="#e63946" stroke-width="3" opacity="0.75"/>
  <circle cx="220" cy="200" r="70" fill="#58a6ff" opacity="0.15"/>

  <rect x="150" y="130" width="140" height="140" rx="8" fill="none" stroke="#58a6ff" stroke-width="4"/>
  <line x1="170" y1="165" x2="270" y2="165" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="200" x2="250" y2="200" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="235" x2="260" y2="235" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>

  <circle cx="110" cy="110" r="26" fill="#e63946" opacity="0.9"/>
  <polygon points="330,110 355,155 305,155" fill="#f4a261" opacity="0.9"/>
  <polygon points="110,330 135,285 85,285" fill="#58a6ff" opacity="0.85"/>

  <!-- dynamic connecting lines -->
  <line x1="380" y1="200" x2="540" y2="200" stroke="#f4a261" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="220" x2="540" y2="220" stroke="#e63946" stroke-width="2" opacity="0.5"/>

  <!-- text block -->
  <text x="580" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f6fc">Aperture</text>
  <text x="582" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9d1d9">A self-evolving news engine that focuses on what you actually want.</text>

  <!-- pipeline chips -->
  <rect x="580" y="250" width="90" height="34" rx="17" fill="#58a6ff" opacity="0.15"/>
  <text x="625" y="273" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58a6ff">scan</text>

  <rect x="685" y="250" width="90" height="34" rx="17" fill="#f4a261" opacity="0.15"/>
  <text x="730" y="273" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f4a261">prescreen</text>

  <rect x="790" y="250" width="90" height="34" rx="17" fill="#e63946" opacity="0.15"/>
  <text x="835" y="273" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e63946">review</text>

  <rect x="895" y="250" width="90" height="34" rx="17" fill="#c9d1d9" opacity="0.15"/>
  <text x="940" y="273" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">publish</text>

  <text x="580" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">Open source · MIT · github.com/lukethecat/aperture</text>
</svg>
