<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- background -->
  <rect width="1200" height="675" fill="#0d1117"/>

  <!-- abstract Kandinsky background composition -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#f4a261" stroke-width="4" opacity="0.7"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#e63946" stroke-width="3" opacity="0.6"/>
  <circle cx="1000" cy="500" r="120" fill="none" stroke="#58a6ff" stroke-width="4" opacity="0.7"/>
  <circle cx="1000" cy="500" r="80" fill="#58a6ff" opacity="0.1"/>

  <polygon points="150,550 190,480 110,480" fill="#e63946" opacity="0.85"/>
  <polygon points="1050,150 1090,220 1010,220" fill="#f4a261" opacity="0.85"/>

  <line x1="0" y1="337" x2="1200" y2="337" stroke="#f4a261" stroke-width="2" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="675" stroke="#58a6ff" stroke-width="2" opacity="0.3"/>

  <!-- main content area -->
  <rect x="320" y="120" width="560" height="435" rx="16" fill="#161b22" opacity="0.9"/>

  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f0f6fc">Aperture</text>
  <text x="600" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9d1d9">A self-evolving news engine that focuses on what you actually want.</text>

  <!-- pipeline -->
  <circle cx="400" cy="340" r="40" fill="#58a6ff" opacity="0.2"/>
  <text x="400" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#58a6ff">SCAN</text>

  <line x1="440" y1="340" x2="500" y2="340" stroke="#c9d1d9" stroke-width="2"/>

  <circle cx="540" cy="340" r="40" fill="#f4a261" opacity="0.2"/>
  <text x="540" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f4a261">FILTER</text>

  <line x1="580" y1="340" x2="640" y2="340" stroke="#c9d1d9" stroke-width="2"/>

  <circle cx="680" cy="340" r="40" fill="#e63946" opacity="0.2"/>
  <text x="680" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e63946">VERIFY</text>

  <line x1="720" y1="340" x2="780" y2="340" stroke="#c9d1d9" stroke-width="2"/>

  <circle cx="820" cy="340" r="40" fill="#c9d1d9" opacity="0.2"/>
  <text x="820" y="346" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">PUBLISH</text>

  <!-- tape bar -->
  <rect x="360" y="420" width="480" height="40" rx="20" fill="none" stroke="#f4a261" stroke-width="2"/>
  <text x="600" y="446" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f4a261">append-only TAPE — every decision is logged</text>

  <!-- footer -->
  <text x="600" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Open source · MIT</text>
  <text x="600" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#58a6ff">github.com/lukethecat/aperture</text>
</svg>
