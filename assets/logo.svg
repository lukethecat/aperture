<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="512" height="512" fill="#0d1117"/>

  <!-- large dynamic circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f4a261" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#e63946" stroke-width="2" opacity="0.8"/>

  <!-- abstract page / tape forms -->
  <rect x="186" y="156" width="140" height="200" rx="6" fill="none" stroke="#58a6ff" stroke-width="4"/>
  <line x1="206" y1="196" x2="306" y2="196" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="206" y1="236" x2="286" y2="236" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="206" y1="276" x2="296" y2="276" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="206" y1="316" x2="276" y2="316" stroke="#c9d1d9" stroke-width="3" stroke-linecap="round"/>

  <!-- Kandinsky-style geometric accents -->
  <circle cx="150" cy="150" r="28" fill="#e63946" opacity="0.9"/>
  <circle cx="362" cy="362" r="22" fill="#f4a261" opacity="0.9"/>
  <polygon points="370,150 390,190 350,190" fill="#58a6ff" opacity="0.85"/>
  <polygon points="150,370 170,330 130,330" fill="#e63946" opacity="0.85"/>

  <!-- dynamic intersecting lines -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#f4a261" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
  <line x1="110" y1="110" x2="402" y2="402" stroke="#e63946" stroke-width="2" opacity="0.4"/>

  <!-- small orbital dots -->
  <circle cx="256" cy="76" r="6" fill="#f4a261"/>
  <circle cx="436" cy="256" r="6" fill="#58a6ff"/>
  <circle cx="256" cy="436" r="6" fill="#e63946"/>
  <circle cx="76" cy="256" r="6" fill="#f4a261"/>
</svg>
